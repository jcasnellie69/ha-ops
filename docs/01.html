<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>z/OS 3.2 Roadmap: Modernizing Mainframe for AI and Hybrid Cloud</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="/fonts/Arvo/index.css" rel="stylesheet"/>
<link href="/fonts/Inter/index.css" rel="stylesheet"/>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #1976D2;
            --color-secondary: #0D47A1;
            --heading-base-size: 2.6rem;
            --body-base-size: 1.0rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #E3F2FD 100%);
            color: #333333;
            overflow: hidden;
        }

        .slide-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: linear-gradient(180deg, #FFFFFF 0%, #E3F2FD 100%);
        }

        .cover-slide {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem;
            position: relative;
        }

        .cover-icon {
            font-size: 3em;
            color: var(--color-primary);
            margin-bottom: 2rem;
        }

        .cover-title {
            font-family: 'Arvo', serif;
            font-size: calc(var(--heading-base-size) * 1.2);
            font-weight: 700;
            color: #1976D2;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            max-width: 90%;
        }

        .cover-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: calc(var(--body-base-size) * 1.4);
            font-weight: 400;
            color: #333333;
            margin-bottom: 3rem;
            line-height: 1.4;
            max-width: 80%;
        }

        .cover-footer {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Inter', sans-serif;
            font-size: calc(var(--body-base-size) * 0.9);
            color: var(--color-secondary);
            text-align: center;
        }

        .footer-line {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
<div class="slide-container">
<div class="cover-slide">
<i class="fas fa-server cover-icon"></i>
<h1 class="cover-title">z/OS 3.2 Roadmap: Modernizing Mainframe for AI and Hybrid Cloud</h1>
<h2 class="cover-subtitle">Strategic Implementation Guide for Enterprise Mainframe Evolution</h2>
<div class="cover-footer">
<div class="footer-line">IBM z/OS 3.2 Strategic Roadmap</div>
<div class="footer-line">February 2026</div>
</div>
</div>
</div>
</body>
</html>
